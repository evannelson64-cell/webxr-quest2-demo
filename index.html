<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quest 2 WebXR Demo</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #87ceeb;
      }
      a-scene {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <a-scene
      background="color: #87ceeb"
      vr-mode-ui="enabled: true"
      embedded
    >
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#4e6e41"
      ></a-plane>

      <a-sky color="#87ceeb"></a-sky>

      <a-box
        position="0 1 -3"
        color="#ff5722"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000"
      ></a-box>

      <a-sphere
        position="2 1.5 -5"
        radius="0.8"
        color="#03a9f4"
      ></a-sphere>

      <a-cylinder
        position="-2 0.75 -4"
        radius="0.5"
        height="1.5"
        color="#9c27b0"
      ></a-cylinder>

      <a-text
        value="Hello Quest 2"
        position="0 2.2 -2"
        align="center"
        color="#ffffff"
        scale="2 2 2"
      ></a-text>

      <a-camera position="0 1.6 4">
        <a-cursor></a-cursor>
      </a-camera>
    </a-scene>
  </body>
</html>

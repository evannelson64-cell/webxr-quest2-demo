<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>High-Poly Memory Palace – WebXR with Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      pointer-events: none;
      font-size: 14px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #vr-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: 0.2s;
      letter-spacing: 0.5px;
    }
    #vr-button:hover {
      background: #ff4757;
      transform: translateX(-50%) scale(1.05);
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      background: rgba(0,0,0,0.6);
      padding: 12px 24px;
      border-radius: 30px;
      display: none;
      z-index: 1000;
    }
    #progress {
      position: absolute;
      top: 70px;
      left: 20px;
      color: white;
      font-size: 13px;
      background: rgba(0,0,0,0.55);
      padding: 8px 14px;
      border-radius: 20px;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">🪔 Happy Diwali! • Trigger to hear Hindi • Move with left joystick</div>
  <button id="vr-button">Enter VR</button>
  <div id="loading">Entering VR…</div>
  <div id="progress">Loading assets… 0%</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaaccff);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.xr.enabled = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.65;
    document.body.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const progressEl = document.getElementById('progress');
    const loadingManager = new THREE.LoadingManager();
    loadingManager.onProgress = (url, loaded, total) => {
      if (progressEl) progressEl.textContent = 'Loading assets… ' + Math.round((loaded / total) * 100) + '%';
    };
    loadingManager.onLoad = () => {
      if (progressEl) progressEl.style.display = 'none';
    };
    loadingManager.onError = (url) => {
      console.error('ASSET LOAD ERR', url);
      if (progressEl) progressEl.textContent = 'Some assets failed to load (see console)';
    };
    const gltfLoader = new GLTFLoader(loadingManager);

    // --- VR Button ---
    const vrButton = document.getElementById('vr-button');
    const loadingEl = document.getElementById('loading');
    const vrButtonThree = VRButton.createButton(renderer);
    vrButtonThree.style.display = 'none';
    document.body.appendChild(vrButtonThree);

    vrButton.addEventListener('click', () => {
      unlockAudio();
      loadingEl.style.display = 'block';
      vrButtonThree.click();
    });

    renderer.xr.addEventListener('sessionstart', () => {
      unlockAudio();
      loadingEl.style.display = 'none';
      console.log('XR session started');
    });

    renderer.xr.addEventListener('sessionend', () => {
      loadingEl.style.display = 'none';
      console.log('XR session ended');
    });

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.28);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.75);
    dirLight.position.set(2, 5, 3);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const fillLight = new THREE.PointLight(0xffeedd, 0.2);
    fillLight.position.set(-2, 3, 2);
    scene.add(fillLight);

    // --- Floor ---
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xc9a06e, roughness: 0.8 });
    const floorGeo = new THREE.PlaneGeometry(6, 6);
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(6, 12, 0x8b6b4d, 0x8b6b4d);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // --- Walls ---
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xdccdb5, roughness: 0.9 });

    const backWall = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 0.2), wallMat);
    backWall.position.set(0, 1.5, -2.9);
    backWall.receiveShadow = true;
    backWall.castShadow = true;
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 6), wallMat);
    leftWall.position.set(-2.9, 1.5, 0);
    leftWall.receiveShadow = true;
    leftWall.castShadow = true;
    scene.add(leftWall);

    // Right wall with a doorway into the second room
    const rightWallA = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 3.8), wallMat);
    rightWallA.position.set(2.9, 1.5, -1.1);
    rightWallA.receiveShadow = true;
    rightWallA.castShadow = true;
    scene.add(rightWallA);

    const rightWallB = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 0.8), wallMat);
    rightWallB.position.set(2.9, 1.5, 2.6);
    rightWallB.receiveShadow = true;
    rightWallB.castShadow = true;
    scene.add(rightWallB);

    const doorLintel = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 1.4), wallMat);
    doorLintel.position.set(2.9, 2.7, 1.5);
    doorLintel.receiveShadow = true;
    doorLintel.castShadow = true;
    scene.add(doorLintel);

    const doorFrameMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.7 });
    [0.8, 2.2].forEach((z) => {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.28, 2.4, 0.12), doorFrameMat);
      post.position.set(2.9, 1.2, z);
      post.castShadow = true;
      post.receiveShadow = true;
      scene.add(post);
    });
    const doorTop = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.12, 1.52), doorFrameMat);
    doorTop.position.set(2.9, 2.4, 1.5);
    doorTop.castShadow = true;
    doorTop.receiveShadow = true;
    scene.add(doorTop);

    // --- Helper ---
    function createBox(w, h, d, color, pos, rot = null) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5, flatShading: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      if (rot) mesh.rotation.set(rot.x, rot.y, rot.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function createCylinder(rTop, rBottom, h, segments, color, pos, rot = null) {
      const geo = new THREE.CylinderGeometry(rTop, rBottom, h, segments);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.55, flatShading: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      if (rot) mesh.rotation.set(rot.x, rot.y, rot.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function createSphere(radius, color, pos, scale = null) {
      const geo = new THREE.SphereGeometry(radius, 10, 8);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, flatShading: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      if (scale) mesh.scale.set(scale.x, scale.y, scale.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const HINDI = {
      'Refrigerator': 'फ्रिज',
      'Counter': 'काउंटर',
      'Stove': 'चूल्हा',
      'Sink': 'सिंक',
      'Chair': 'कुर्सी',
      'Table': 'मेज़',
      'Plate': 'थाली',
      'Fork': 'कांटा',
      'Spoon': 'चम्मच',
      'Mug': 'मग',
      'Sofa': 'सोफ़ा',
      'TV': 'टीवी',
      'Lamp': 'लैंप',
      'Clock': 'घड़ी',
      'Book': 'किताब',
      'Plant': 'पौधा',
      'Rug': 'कालीन',
      'Window': 'खिड़की',
      'Bookshelf': 'किताबों की अलमारी',
      'Guitar': 'गिटार',
      'Balloon': 'गुब्बारा',
      'Teddy Bear': 'टेडी बियर',
      'Robot': 'रोबोट',
      'Skateboard': 'स्केटबोर्ड',
      'Pizza': 'पिज़्ज़ा',
      'Rubber Duck': 'रबर बत्तख',
      'UFO': 'यूएफ़ओ',
      'Dinosaur': 'डायनासोर',
      'Magic Lamp': 'जादुई चिराग',
      'Disco Ball': 'डिस्को बॉल',
      'Vase': 'फूलदान',
      'Dragon': 'ड्रैगन',
      'Duck': 'बत्तख',
      'Fox': 'लोमड़ी',
      'Car': 'गाड़ी',
      'Pool': 'स्विमिंग पूल',
      'Pool Deck': 'पूल डेक',
      'Grill': 'ग्रिल',
      'Dancing Man': 'नाचता आदमी'
    };
    const labels = [];
    const labelGeometry = new THREE.PlaneGeometry(1, 1);

    // Sprites billboard in screen space: the sprite vertex shader takes the
    // sprite's origin into view space and offsets the quad in view-space X/Y.
    // The sprite's quaternion / material rotation never changes which way the
    // quad faces, so a Sprite always tilts with head pitch. Use a flat mesh and
    // orient it ourselves with a yaw-only rotation in the frame loop.
    function makeBillboard(texture, width, height, opts) {
      opts = opts || {};
      // MeshBasicMaterial is unlit like SpriteMaterial, and tone mapping stays
      // enabled so the label brightness matches what the sprites looked like.
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        depthTest: opts.depthTest !== false,
        depthWrite: opts.depthWrite !== false,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(labelGeometry, material);
      mesh.scale.set(width, height, 1);
      mesh.renderOrder = opts.renderOrder || 0;
      mesh.userData.isPickable = false;
      mesh.userData.baseScale = { x: width, y: height };
      mesh.userData.distanceScale = opts.distanceScale !== false;
      mesh.raycast = function () {};
      labels.push(mesh);
      return mesh;
    }

    function addLabel(parent, text, height) {
      const hindi = HINDI[text] || text;
      parent.userData.hindi = hindi;
      parent.userData.label = text;
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 96;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 96);
      ctx.fillStyle = 'rgba(15, 20, 30, 0.66)';
      ctx.beginPath();
      const r = 18;
      ctx.moveTo(8 + r, 5);
      ctx.lineTo(248 - r, 5); ctx.quadraticCurveTo(248, 5, 248, 5 + r);
      ctx.lineTo(248, 91 - r); ctx.quadraticCurveTo(248, 91, 248 - r, 91);
      ctx.lineTo(8 + r, 91); ctx.quadraticCurveTo(8, 91, 8, 91 - r);
      ctx.lineTo(8, 5 + r); ctx.quadraticCurveTo(8, 5, 8 + r, 5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.font = 'bold 24px Arial';
      ctx.fillText(text, 128, 28);
      ctx.font = 'bold 26px "Noto Sans Devanagari", "Mangal", Arial';
      ctx.fillText(hindi, 128, 68);
      // tiny play triangle
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(96, 20);
      ctx.lineTo(96, 36);
      ctx.lineTo(110, 28);
      ctx.closePath();
      ctx.fill();
      const texture = new THREE.CanvasTexture(canvas);
      const label = makeBillboard(texture, 0.44, 0.165, {
        depthTest: false,
        depthWrite: false,
        renderOrder: 5
      });
      label.position.set(0, height, 0);
      parent.add(label);
      return label;
    }
    // --- Refrigerator ---
    const fridgeGroup = new THREE.Group();
    const fridgeBody = createBox(1.0, 1.8, 0.8, 0xcccccc, { x: 0, y: 0.9, z: 0 });
    fridgeGroup.add(fridgeBody);
    const handle = createBox(0.08, 0.4, 0.08, 0x888888, { x: 0.45, y: 1.0, z: 0 });
    fridgeGroup.add(handle);
    const divider = createBox(1.0, 0.04, 0.8, 0xaaaaaa, { x: 0, y: 1.2, z: 0 });
    fridgeGroup.add(divider);
    const handle2 = createBox(0.08, 0.2, 0.08, 0x888888, { x: 0.45, y: 1.6, z: 0 });
    fridgeGroup.add(handle2);
    fridgeGroup.position.set(-2.2, 0, -2.4);
    fridgeGroup.userData.isEnvironment = true;
    fridgeGroup.userData.label = 'Refrigerator';
    [fridgeBody, handle, divider, handle2].forEach(m => { m.userData.isEnvironment = true; m.userData.isPickable = false; });
    scene.add(fridgeGroup);
    addLabel(fridgeGroup, 'Refrigerator', 2.0);

    // --- Kitchen Counter ---
    const counterMat = new THREE.MeshStandardMaterial({ color: 0xc7a27a, roughness: 0.7, flatShading: true });
    const counterTop = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.1, 1.0), counterMat);
    counterTop.position.set(0.5, 0.9, -2.3);
    counterTop.castShadow = true;
    counterTop.receiveShadow = true;
    counterTop.userData.isEnvironment = true;
    scene.add(counterTop);
    addLabel(counterTop, 'Counter', 0.2);

    const baseMat = new THREE.MeshStandardMaterial({ color: 0xb08b5e, roughness: 0.8, flatShading: true });
    const base1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), baseMat);
    base1.position.set(-1.2, 0.4, -2.3);
    base1.castShadow = true;
    base1.receiveShadow = true;
    scene.add(base1);
    const base2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), baseMat);
    base2.position.set(0.5, 0.4, -2.3);
    base2.castShadow = true;
    base2.receiveShadow = true;
    scene.add(base2);
    const base3 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), baseMat);
    base3.position.set(2.2, 0.4, -2.3);
    base3.castShadow = true;
    base3.receiveShadow = true;
    scene.add(base3);

    const sideCounter = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 1.8), counterMat);
    sideCounter.position.set(-2.1, 0.9, -1.2);
    sideCounter.castShadow = true;
    sideCounter.receiveShadow = true;
    scene.add(sideCounter);
    const sideBase = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 1.6), baseMat);
    sideBase.position.set(-2.1, 0.4, -1.2);
    sideBase.castShadow = true;
    sideBase.receiveShadow = true;
    scene.add(sideBase);

    // --- Stove ---
    const stoveBase = createBox(0.8, 0.1, 0.8, 0x333333, { x: 1.0, y: 0.95, z: -2.3 });
    stoveBase.userData.isEnvironment = true;
    scene.add(stoveBase);
    addLabel(stoveBase, 'Stove', 0.3);
    const burnerMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x331100 });
    for (let i = 0; i < 4; i++) {
      const burner = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.02, 8), burnerMat);
      burner.position.set(1.0 + (i % 2 === 0 ? -0.2 : 0.2), 1.02, -2.3 + (i < 2 ? -0.2 : 0.2));
      burner.castShadow = true;
      burner.userData.isEnvironment = true;
      burner.userData.isPickable = false;
      scene.add(burner);
    }

    // --- Sink ---
    const sinkMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.6, roughness: 0.3 });
    const sinkBasin = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.15, 0.7), sinkMat);
    sinkBasin.position.set(-0.5, 0.85, -2.3);
    sinkBasin.castShadow = true;
    sinkBasin.receiveShadow = true;
    sinkBasin.userData.isEnvironment = true;
    scene.add(sinkBasin);
    addLabel(sinkBasin, 'Sink', 0.3);
    const faucetGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.4, 6);
    const faucetMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 });
    const faucet = new THREE.Mesh(faucetGeo, faucetMat);
    faucet.position.set(-0.5, 1.15, -2.1);
    faucet.rotation.x = 0.3;
    faucet.castShadow = true;
    faucet.userData.isEnvironment = true;
    faucet.userData.isPickable = false;
    scene.add(faucet);

    // --- Chair ---
    function createChair(posX, posZ, rotY = 0) {
      const chairGroup = new THREE.Group();
      const seatMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.7, flatShading: true });
      const legMat = new THREE.MeshStandardMaterial({ color: 0x5a3e1a, roughness: 0.8, flatShading: true });

      const seat = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 0.7), seatMat);
      seat.position.y = 0.45;
      seat.castShadow = true;
      seat.receiveShadow = true;
      chairGroup.add(seat);

      const back = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.08), seatMat);
      back.position.set(0, 0.8, -0.3);
      back.castShadow = true;
      back.receiveShadow = true;
      chairGroup.add(back);

      const legPositions = [
        [-0.3, 0.2, -0.3],
        [0.3, 0.2, -0.3],
        [-0.3, 0.2, 0.3],
        [0.3, 0.2, 0.3]
      ];
      legPositions.forEach(pos => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.45, 0.1), legMat);
        leg.position.set(pos[0], pos[1], pos[2]);
        leg.castShadow = true;
        leg.receiveShadow = true;
        chairGroup.add(leg);
      });

      chairGroup.position.set(posX, 0, posZ);
      chairGroup.rotation.y = rotY;
      chairGroup.userData.isPickable = true;
      chairGroup.userData.label = 'Chair';
      chairGroup.traverse((c) => { if (c !== chairGroup) c.userData.isPickable = false; });
      addLabel(chairGroup, 'Chair', 1.2);
      return chairGroup;
    }

    scene.add(createChair(-1.0, 0.8, 0.2));
    scene.add(createChair(0.8, 1.2, -0.3));
    scene.add(createChair(1.8, 0.2, 0.5));

    // --- Table ---
    const tableGroup = new THREE.Group();
    const tableMat = new THREE.MeshStandardMaterial({ color: 0xa67b5b, roughness: 0.7, flatShading: true });
    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 1.0), tableMat);
    tableTop.position.set(0.5, 0.75, 0.5);
    tableTop.castShadow = true;
    tableTop.receiveShadow = true;
    tableTop.userData.isEnvironment = true;
    tableTop.userData.isPickable = false;
    tableGroup.add(tableTop);

    const tLegMat = new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 0.8 });
    const tLegPos = [[0.5-0.7, 0.35, 0.5-0.4], [0.5+0.7, 0.35, 0.5-0.4], [0.5-0.7, 0.35, 0.5+0.4], [0.5+0.7, 0.35, 0.5+0.4]];
    tLegPos.forEach(pos => {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.7, 0.1), tLegMat);
      leg.position.set(pos[0], pos[1], pos[2]);
      leg.castShadow = true;
      leg.receiveShadow = true;
      leg.userData.isEnvironment = true;
      leg.userData.isPickable = false;
      tableGroup.add(leg);
    });
    tableGroup.userData.isEnvironment = true;
    tableGroup.userData.label = 'Table';
    scene.add(tableGroup);
    addLabel(tableGroup, 'Table', 1.0);

    // --- Plates, Forks, Spoons ---
    function createPlate(x, y, z) {
      const plateGroup = new THREE.Group();
      const plateMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.3, flatShading: true });
      const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.03, 8), plateMat);
      plate.position.set(0, 0, 0);
      plate.castShadow = true;
      plate.receiveShadow = true;
      plateGroup.add(plate);
      const innerMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.4 });
      const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.01, 8), innerMat);
      inner.position.set(0, 0.015, 0);
      inner.castShadow = true;
      inner.receiveShadow = true;
      plateGroup.add(inner);
      plateGroup.position.set(x, y, z);
      plateGroup.userData.isPickable = true;
      plateGroup.userData.label = 'Plate';
      plate.userData.isPickable = false;
      inner.userData.isPickable = false;
      scene.add(plateGroup);
      addLabel(plateGroup, 'Plate', 0.15);
    }

    function createFork(x, y, z, rotY = 0) {

    function makeCanvasTexture(size, drawFn, repeatX, repeatY) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      drawFn(c.getContext('2d'), size, size);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX || 1, repeatY || 1);
      return tex;
    }

      ctx.fillStyle = '#b9a68a';
      ctx.fillRect(0, 0, w, h);
      const plank = 32;
      for (let y = 0; y < h; y += plank) {
        const shade = 0.86 + Math.random() * 0.2;
        ctx.fillStyle = 'rgb(' + Math.floor(150 * shade) + ',' + Math.floor(130 * shade) + ',' + Math.floor(104 * shade) + ')';
        ctx.fillRect(0, y + 1, w, plank - 2);
        ctx.strokeStyle = 'rgba(90, 74, 54, 0.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(w, y + 0.5);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(120, 100, 76, 0.25)';
        for (let g = 0; g < 3; g++) {
          const gy = y + 6 + Math.random() * (plank - 12);
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.bezierCurveTo(w * 0.33, gy + 3, w * 0.66, gy - 3, w, gy + 1);
          ctx.stroke();
        }
      }
    }, 6, 6);

      g.addColorStop(0, '#2b86b5');
      g.addColorStop(0.5, '#3aa6d4');
      g.addColorStop(1, '#1f6f96');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(190, 235, 255, 0.5)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 26; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, 6 + Math.random() * 26,
          Math.PI * (0.15 + Math.random() * 0.5), Math.PI * (0.55 + Math.random() * 0.5));
        ctx.stroke();

    }, 3, 2);

    // --- Imported high-poly glTF assets ---
    function placeGLTF(name, opts) {
      gltfLoader.load('assets/models/' + name + '.glb', (gltf) => {
        try {
          const model = gltf.scene;
          if (opts.hideMeshes) {
            const hidden = [];
            model.traverse((o) => {
              if (o.isMesh && opts.hideMeshes.includes(o.name)) hidden.push(o);
            });
            hidden.forEach((o) => { if (o.parent) o.parent.remove(o); });
          }
          model.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = opts.castShadow !== false;
              o.receiveShadow = true;
              if (opts.material) {
                o.material = opts.material;
              } else {
                const mats = Array.isArray(o.material) ? o.material : [o.material];
                mats.forEach((m) => { if (m) { m.envMap = envTexture; m.envMapIntensity = opts.envMapIntensity || 1.0; } });
              }
            }
          });
          const size = new THREE.Vector3();
          new THREE.Box3().setFromObject(model).getSize(size);
          const scale = (opts.height || 1) / Math.max(size.y, 0.0001);
          model.scale.setScalar(scale);
          const scaledBox = new THREE.Box3().setFromObject(model);
          const center = new THREE.Vector3();
          scaledBox.getCenter(center);
          model.position.x -= center.x;
          model.position.z -= center.z;
          model.position.y -= scaledBox.min.y;

          const root = new THREE.Group();
          root.add(model);
          root.position.set(opts.x, opts.y || 0, opts.z);
          root.rotation.y = opts.rotationY || 0;
          addRoomEnvironment(root);
          if (opts.label) {
            const h = opts.labelHeight != null ? opts.labelHeight : (opts.height || 1) + 0.3;
            addLabel(root, opts.label, h);
          }
          if (gltf.animations && gltf.animations.length) {
            const mixer = new THREE.AnimationMixer(model);
            const clip = opts.clip
              ? gltf.animations.find((a) => a.name === opts.clip) || gltf.animations[0]
              : gltf.animations[0];
            if (clip) mixer.clipAction(clip).play();
            animatedObjects.push((t, dt) => mixer.update(dt));
          }
          console.log('ASSET READY', name);
        } catch (e) {
          console.error('MODEL PLACE ERR', name, e);
        }
      }, undefined, (err) => console.error('MODEL LOAD ERR', name, err));
    }

    function getAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      return audioCtx;
    }

    function loadAudioClips() {
      if (audioLoadPromise) return audioLoadPromise;
      const ctx = getAudioContext();
      if (!ctx) return Promise.resolve();
      audioLoadPromise = Promise.all(Object.keys(AUDIO_CLIPS).map(async (label) => {
        try {
          const res = await fetch(AUDIO_CLIPS[label]);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.arrayBuffer();
          audioBuffers[label] = await ctx.decodeAudioData(data);
        } catch (e) {
          console.error('AUDIO LOAD ERR', label, e);
        }
      }));
      return audioLoadPromise;
    }

    function unlockAudio() {
      const ctx = getAudioContext();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      loadAudioClips();

    function speakFallback(text) {
      if (!('speechSynthesis' in window)) return false;
      try {
        window.speechSynthesis.resume();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'hi-IN';
        const voices = window.speechSynthesis.getVoices();
        const v = voices.find((x) => x.lang && x.lang.toLowerCase().startsWith('hi'));
        if (v) u.voice = v;
        u.volume = 1;
        u.rate = 1;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
        return true;
      } catch (err) {
        console.error('SPEECH ERR', err);
        return false;
      }
    }

    async function speakHindi(label) {
      if (!label) return;
      const text = HINDI[label] || label;
      const info = document.getElementById('info');
      const ctx = getAudioContext();
      if (ctx && ctx.state === 'suspended') {
        try { await ctx.resume(); } catch (e) { console.error('RESUME ERR', e); }
      }
      if (info) info.textContent = 'Speaking: ' + text;

      await loadAudioClips();
      const buffer = audioBuffers[label];
      if (buffer && ctx && ctx.state === 'running') {
        try {
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          src.connect(ctx.destination);
          src.start();
          return;
        } catch (e) { console.error('PLAY ERR', e); }
      }
      if (info) info.textContent = 'Speaking (fallback): ' + text;
      speakFallback(text);

      tempMatrix0.identity().extractRotation(controller.matrixWorld);
      const rc = new THREE.Raycaster();
      rc.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      rc.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix0);
      const allHits = rc.intersectObjects(scene.children, true);
      for (let i = 0; i < allHits.length; i++) {

          o = o.parent;

      const tempMatrix = new THREE.Matrix4();

          controller.attach(pickableRoot);

          pickableRoot.rotation.set(0, 0, 0);

    // --- NEW: Left thumbstick from session ---
    function getLeftThumbstickFromSession() {
      const session = renderer.xr.getSession();
      if (!session) return { x: 0, y: 0 };

      for (const inputSource of session.inputSources) {
        if (inputSource && inputSource.handedness === 'left' && inputSource.gamepad && inputSource.gamepad.axes) {
          const axes = inputSource.gamepad.axes;
          let x = 0;
          let y = 0;

          if (axes.length >= 4) {
            const mag01 = Math.hypot(axes[0] || 0, axes[1] || 0);
            const mag23 = Math.hypot(axes[2] || 0, axes[3] || 0);

            if (mag23 >= mag01) {
              x = axes[2];
              y = axes[3];
            } else {
              x = axes[0];
              y = axes[1];
            }
          } else if (axes.length >= 2) {
            x = axes[0];
            y = axes[1];
          }

          if (Math.abs(x) < 0.12) x = 0;
          if (Math.abs(y) < 0.12) y = 0;

          return { x, y };
        }
      }

      return { x: 0, y: 0 };
    }

    function getRightThumbstickFromSession() {
      const session = renderer.xr.getSession();
      if (!session) return { x: 0, y: 0 };

      for (const inputSource of session.inputSources) {
        if (inputSource && inputSource.handedness === 'right' && inputSource.gamepad && inputSource.gamepad.axes) {
          const axes = inputSource.gamepad.axes;
          let x = 0;
          let y = 0;

          if (axes.length >= 4) {
            const mag01 = Math.hypot(axes[0] || 0, axes[1] || 0);
            const mag23 = Math.hypot(axes[2] || 0, axes[3] || 0);

            if (mag23 >= mag01) {
              x = axes[2];
              y = axes[3];
            } else {
              x = axes[0];
              y = axes[1];
            }
          } else if (axes.length >= 2) {
            x = axes[0];
            y = axes[1];
          }

          if (Math.abs(x) < 0.12) x = 0;
          if (Math.abs(y) < 0.12) y = 0;

          return { x, y };
        }
      }

      return { x: 0, y: 0 };
    }
    const clock = new THREE.Clock();
    const labelCamPos = new THREE.Vector3();
    const labelWorldPos = new THREE.Vector3();
    const labelParentQuat = new THREE.Quaternion();
    const labelTargetQuat = new THREE.Quaternion();
    const labelUpAxis = new THREE.Vector3(0, 1, 0);

    renderer.setAnimationLoop(() => {
      try {
      const delta = clock.getDelta();
      const elapsed = clock.elapsedTime;

      animatedObjects.forEach((animate) => animate(elapsed, delta));

      if (labels.length) {
        const camPos = renderer.xr.isPresenting
          ? renderer.xr.getCamera(camera).getWorldPosition(labelCamPos)
          : camera.getWorldPosition(labelCamPos);
        labels.forEach((label) => {
          label.getWorldPosition(labelWorldPos);

          // Yaw-only billboard: face the viewer horizontally and stay upright.
          // Pitch and roll are discarded, so labels never tilt with the head.
          // The plane's normal is +Z, so this yaw points it at the camera.
          const dx = camPos.x - labelWorldPos.x;
          const dz = camPos.z - labelWorldPos.z;
          labelTargetQuat.setFromAxisAngle(labelUpAxis, Math.atan2(dx, dz));

          // Labels are children of objects that can be rotated (glTF roots,
          // controllers while an object is held), so convert the desired world
          // rotation into the parent's local space instead of setting it directly.
          label.parent.getWorldQuaternion(labelParentQuat);
          label.quaternion.copy(labelParentQuat.invert().multiply(labelTargetQuat));

          const base = label.userData.baseScale;
          const f = label.userData.distanceScale
            ? THREE.MathUtils.clamp(camPos.distanceTo(labelWorldPos) / 4, 0.62, 1.4)
            : 1;
          label.scale.set(base.x * f, base.y * f, 1);

      }

      if (renderer.xr.isPresenting) {

        if (thumbstick.x !== 0 || thumbstick.y !== 0) {

          forward.y = 0;
          forward.normalize();

          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(xrCamera.quaternion);
          right.y = 0;
          right.normalize();

          const moveDirection = new THREE.Vector3();
          moveDirection.addScaledVector(forward, -thumbstick.y);
          moveDirection.addScaledVector(right, thumbstick.x);

          if (moveDirection.lengthSq() > 0) {
            moveDirection.normalize();
            playerRig.position.addScaledVector(moveDirection, 1.5 * delta);
          }
        }

        // Right thumbstick: turn view left/right (yaw)
        const rightStick = getRightThumbstickFromSession();
        if (rightStick.x !== 0) {
          playerRig.rotation.y -= rightStick.x * 1.8 * delta;
        }
        playerRig.rotation.z = 0;
      }

       // Tether return animation
       for (let i = returningObjects.length - 1; i >= 0; i--) {
         const o = returningObjects[i];
         if (!o || !o.userData || !o.userData.homePosition || !o.userData.returnStart || !o.userData.returnQuatStart) {
           returningObjects.splice(i, 1);
           continue;
         }
         o.userData.returnProgress = (o.userData.returnProgress || 0) + delta * 2.5;
         const t = Math.min(1, o.userData.returnProgress);
         const ease = 1 - Math.pow(1 - t, 3);
         if (!o.userData.returnStart) o.userData.returnStart = o.position.clone();
         o.position.lerpVectors(o.userData.returnStart, o.userData.homePosition, ease);
         o.quaternion.copy(o.userData.returnQuatStart).slerp(o.userData.homeQuaternion, ease);
         if (t >= 1) {
           o.position.copy(o.userData.homePosition);
           o.quaternion.copy(o.userData.homeQuaternion);
           returningObjects.splice(i, 1);
         }
       }

       renderer.render(scene, camera);
      } catch (e) {
        console.error('LOOP ERR', e);
        const info = document.getElementById('info');
        if (info) info.textContent = 'ERROR: ' + (e && e.message ? e.message : e);
      }
    });

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('Pickable objects:', pickableObjects.length);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>High-Poly Memory Palace – WebXR with Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      pointer-events: none;
      font-size: 14px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #vr-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: 0.2s;
      letter-spacing: 0.5px;
    }
    #vr-button:hover {
      background: #ff4757;
      transform: translateX(-50%) scale(1.05);
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      background: rgba(0,0,0,0.6);
      padding: 12px 24px;
      border-radius: 30px;
      display: none;
      z-index: 1000;
    }
    #progress {
      position: absolute;
      top: 70px;
      left: 20px;
      color: white;
      font-size: 13px;
      background: rgba(0,0,0,0.55);
      padding: 8px 14px;
      border-radius: 20px;
      z-index: 1000;
      pointer-events: none;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaaccff);

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.xr.enabled = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.65;

      const q = Number(new URLSearchParams(location.search).get('world'));

        name: 'World 1 - Home & Food',

    loadingManager.onProgress = (url, loaded, total) => {
      if (progressEl) progressEl.textContent = 'Loading assets… ' + Math.round((loaded / total) * 100) + '%';
    };
    loadingManager.onLoad = () => {
      if (progressEl) progressEl.style.display = 'none';
    };
    loadingManager.onError = (url) => {
      console.error('ASSET LOAD ERR', url);
      if (progressEl) progressEl.textContent = 'Some assets failed to load (see console)';

    function createBox(w, h, d, color, pos, rot = null) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5, flatShading: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      if (rot) mesh.rotation.set(rot.x, rot.y, rot.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function createCylinder(rTop, rBottom, h, segments, color, pos, rot = null) {
      const geo = new THREE.CylinderGeometry(rTop, rBottom, h, segments);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.55, flatShading: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      if (rot) mesh.rotation.set(rot.x, rot.y, rot.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function createSphere(radius, color, pos, scale = null) {
      const geo = new THREE.SphereGeometry(radius, 10, 8);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, flatShading: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      if (scale) mesh.scale.set(scale.x, scale.y, scale.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const labels = [];
    const labelGeometry = new THREE.PlaneGeometry(1, 1);

    // Sprites billboard in screen space: the sprite vertex shader takes the
    // sprite's origin into view space and offsets the quad in view-space X/Y.
    // The sprite's quaternion / material rotation never changes which way the
    // quad faces, so a Sprite always tilts with head pitch. Use a flat mesh and
    // orient it ourselves with a yaw-only rotation in the frame loop.
    function makeBillboard(texture, width, height, opts) {
      opts = opts || {};
      // MeshBasicMaterial is unlit like SpriteMaterial, and tone mapping stays
      // enabled so the label brightness matches what the sprites looked like.
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        depthTest: opts.depthTest !== false,
        depthWrite: opts.depthWrite !== false,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(labelGeometry, material);
      mesh.scale.set(width, height, 1);
      mesh.renderOrder = opts.renderOrder || 0;
      mesh.userData.isPickable = false;
      mesh.userData.baseScale = { x: width, y: height };
      mesh.userData.distanceScale = opts.distanceScale !== false;
      mesh.raycast = function () {};
      labels.push(mesh);
      return mesh;
    }

    function addLabel(parent, text, height) {
      const hindi = HINDI[text] || text;
      parent.userData.hindi = hindi;
      parent.userData.label = text;
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 96;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 96);
      ctx.fillStyle = 'rgba(15, 20, 30, 0.66)';
      ctx.beginPath();
      const r = 18;
      ctx.moveTo(8 + r, 5);
      ctx.lineTo(248 - r, 5); ctx.quadraticCurveTo(248, 5, 248, 5 + r);
      ctx.lineTo(248, 91 - r); ctx.quadraticCurveTo(248, 91, 248 - r, 91);
      ctx.lineTo(8 + r, 91); ctx.quadraticCurveTo(8, 91, 8, 91 - r);
      ctx.lineTo(8, 5 + r); ctx.quadraticCurveTo(8, 5, 8 + r, 5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.font = 'bold 24px Arial';
      ctx.fillText(text, 128, 28);
      ctx.font = 'bold 26px "Noto Sans Devanagari", "Mangal", Arial';
      ctx.fillText(hindi, 128, 68);
      // tiny play triangle
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(96, 20);
      ctx.lineTo(96, 36);
      ctx.lineTo(110, 28);
      ctx.closePath();
      ctx.fill();
      const texture = new THREE.CanvasTexture(canvas);
      const label = makeBillboard(texture, 0.44, 0.165, {
        depthTest: false,
        depthWrite: false,
        renderOrder: 5
      });
      label.position.set(0, height, 0);
      parent.add(label);
      return label;
    }

    const faucetGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.4, 6);
    const faucetMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 });
    const faucet = new THREE.Mesh(faucetGeo, faucetMat);

    function makeCanvasTexture(size, drawFn, repeatX, repeatY) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      drawFn(c.getContext('2d'), size, size);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX || 1, repeatY || 1);
      return tex;
    }

    // Deck: weathered planks drawn procedurally, so no binary assets needed.
    const deckTexture = makeCanvasTexture(256, (ctx, w, h) => {
      ctx.fillStyle = '#b9a68a';
      ctx.fillRect(0, 0, w, h);
      const plank = 32;
      for (let y = 0; y < h; y += plank) {
        const shade = 0.86 + Math.random() * 0.2;
        ctx.fillStyle = 'rgb(' + Math.floor(150 * shade) + ',' + Math.floor(130 * shade) + ',' + Math.floor(104 * shade) + ')';
        ctx.fillRect(0, y + 1, w, plank - 2);
        ctx.strokeStyle = 'rgba(90, 74, 54, 0.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(w, y + 0.5);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(120, 100, 76, 0.25)';
        for (let g = 0; g < 3; g++) {
          const gy = y + 6 + Math.random() * (plank - 12);
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.bezierCurveTo(w * 0.33, gy + 3, w * 0.66, gy - 3, w, gy + 1);
          ctx.stroke();
        }
      }
    }, 6, 6);

    // Water: gradient plus caustic arcs, scrolled in the frame loop.
    const waterTexture = makeCanvasTexture(256, (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#2b86b5');
      g.addColorStop(0.5, '#3aa6d4');
      g.addColorStop(1, '#1f6f96');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(190, 235, 255, 0.5)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 26; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, 6 + Math.random() * 26,
          Math.PI * (0.15 + Math.random() * 0.5), Math.PI * (0.55 + Math.random() * 0.5));
        ctx.stroke();
      }
    }, 3, 2);

    const G = {

      cyl: (r, h, s) => new THREE.CylinderGeometry(r, r, h, s || 14),
      sph: (r) => new THREE.SphereGeometry(r, 16, 12),

      torus: (r, t) => new THREE.TorusGeometry(r, t, 8, 18)
    };
    const partMats = new Map();
    function matFor(color) {
      if (!partMats.has(color)) {
        partMats.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.5, flatShading: true }));
      }
      return partMats.get(color);
    }
    function addPart(parent, geo, color, x, y, z, rx, ry, rz) {
      const mesh = new THREE.Mesh(geo, matFor(color));
      mesh.position.set(x || 0, y || 0, z || 0);
      if (rx || ry || rz) mesh.rotation.set(rx || 0, ry || 0, rz || 0);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }
    const B = (g, w, h, d, c, x, y, z, ry) => addPart(g, G.box(w, h, d), c, x, y, z, 0, ry, 0);
    const C = (g, r, h, c, x, y, z, rx) => addPart(g, G.cyl(r, h), c, x, y, z, rx, 0, 0);
    const S = (g, r, c, x, y, z) => addPart(g, G.sph(r), c, x, y, z);
    const K = (g, r, h, c, x, y, z) => addPart(g, G.cone(r, h), c, x, y, z);
    const T = (g, r, t, c, x, y, z, rx, ry) => addPart(g, G.torus(r, t), c, x, y, z, rx, ry, 0);

    // Each builder draws from y = 0 (pedestal top) upward.
    const WORD_MODELS = {
      Water(g) {
        C(g, 0.1, 0.3, 0x8fd0ea, 0, 0.15, 0);
        C(g, 0.045, 0.05, 0x2f6f96, 0, 0.32, 0);

    // --- Imported high-poly glTF assets ---
    function placeGLTF(name, opts) {
      gltfLoader.load('assets/models/' + name + '.glb', (gltf) => {
        try {
          const model = gltf.scene;
          if (opts.hideMeshes) {
            const hidden = [];
            model.traverse((o) => {
              if (o.isMesh && opts.hideMeshes.includes(o.name)) hidden.push(o);
            });
            hidden.forEach((o) => { if (o.parent) o.parent.remove(o); });
          }
          model.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = opts.castShadow !== false;
              o.receiveShadow = true;
              if (opts.material) {
                o.material = opts.material;
              } else {
                const mats = Array.isArray(o.material) ? o.material : [o.material];
                mats.forEach((m) => { if (m) { m.envMap = envTexture; m.envMapIntensity = opts.envMapIntensity || 1.0; } });
              }
            }
          });
          const size = new THREE.Vector3();
          new THREE.Box3().setFromObject(model).getSize(size);
          const scale = (opts.height || 1) / Math.max(size.y, 0.0001);
          model.scale.setScalar(scale);
          const scaledBox = new THREE.Box3().setFromObject(model);
          const center = new THREE.Vector3();
          scaledBox.getCenter(center);
          model.position.x -= center.x;
          model.position.z -= center.z;
          model.position.y -= scaledBox.min.y;

          const root = new THREE.Group();
          root.add(model);
          root.position.set(opts.x, opts.y || 0, opts.z);
          root.rotation.y = opts.rotationY || 0;
          addRoomEnvironment(root);
          if (opts.label) {
            const h = opts.labelHeight != null ? opts.labelHeight : (opts.height || 1) + 0.3;
            addLabel(root, opts.label, h);
          }
          if (gltf.animations && gltf.animations.length) {
            const mixer = new THREE.AnimationMixer(model);
            const clip = opts.clip
              ? gltf.animations.find((a) => a.name === opts.clip) || gltf.animations[0]
              : gltf.animations[0];
            if (clip) mixer.clipAction(clip).play();
            animatedObjects.push((t, dt) => mixer.update(dt));
          }
          console.log('ASSET READY', name);
        } catch (e) {
          console.error('MODEL PLACE ERR', name, e);
        }
      }, undefined, (err) => console.error('MODEL LOAD ERR', name, err));
    }

    function loadAudioClips() {
      if (audioLoadPromise) return audioLoadPromise;
      const ctx = getAudioContext();
      if (!ctx) return Promise.resolve();
      audioLoadPromise = Promise.all(Object.keys(HINDI).map(async (label) => {
        try {
          const res = await fetch(audioUrlFor(label));
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.arrayBuffer();
          audioBuffers[label] = await ctx.decodeAudioData(data);
        } catch (e) {
          console.error('AUDIO LOAD ERR', label, e);
        }
      }));
      return audioLoadPromise;
    }

        const voices = window.speechSynthesis.getVoices();
        const v = voices.find((x) => x.lang && x.lang.toLowerCase().startsWith('hi'));
        if (v) u.voice = v;
        u.volume = 1;
        u.rate = 1;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);

    function getLeftThumbstickFromSession() {
      const session = renderer.xr.getSession();
      if (!session) return { x: 0, y: 0 };

      for (const inputSource of session.inputSources) {
        if (inputSource && inputSource.handedness === 'left' && inputSource.gamepad && inputSource.gamepad.axes) {
          const axes = inputSource.gamepad.axes;
          let x = 0;
          let y = 0;

          if (axes.length >= 4) {
            const mag01 = Math.hypot(axes[0] || 0, axes[1] || 0);
            const mag23 = Math.hypot(axes[2] || 0, axes[3] || 0);

            if (mag23 >= mag01) {
              x = axes[2];
              y = axes[3];
            } else {
              x = axes[0];
              y = axes[1];
            }
          } else if (axes.length >= 2) {
            x = axes[0];
            y = axes[1];
          }

          if (Math.abs(x) < 0.12) x = 0;
          if (Math.abs(y) < 0.12) y = 0;

          return { x, y };
        }
      }

      return { x: 0, y: 0 };
    }

      }

      // --- Portal: dwell inside the ring to load the next world ---
      const headPos = renderer.xr.isPresenting
        ? renderer.xr.getCamera(camera).getWorldPosition(portalTmp)
        : camera.getWorldPosition(portalTmp);
      const pdx = headPos.x - rotCX;
      const pdz = headPos.z - rotCZ;
      const inPortal = (pdx * pdx + pdz * pdz) < 0.81 && headPos.y < 2.4;
      if (inPortal) {
        portalDwell += delta;
        portalRing.scale.setScalar(1 + Math.sin(elapsed * 6) * 0.04 + Math.min(portalDwell, 1.2) * 0.06);
        const infoEl = document.getElementById('info');
        if (infoEl) {
          infoEl.textContent = 'Travelling to World ' + CFG.next + '  ' +
            Math.min(100, Math.round((portalDwell / 1.2) * 100)) + '%';
        }
        if (portalDwell >= 1.2) {
          location.href = 'index.html?world=' + CFG.next;
        }
      } else {
        portalDwell = 0;
        portalRing.scale.setScalar(1 + Math.sin(elapsed * 3) * 0.03);
      }

      if (renderer.xr.isPresenting) {
        // Left X/Y buttons raise and lower the whole rig like an elevator.
        const face = getLeftFaceButtonsFromSession();
        if (face.y || face.x) {
          const step = HEIGHT_SPEED * Math.min(delta, 0.1);
          if (face.y) heightOffset += step + (prevFaceButtons.y ? 0 : HEIGHT_TAP);
          if (face.x) heightOffset -= step + (prevFaceButtons.x ? 0 : HEIGHT_TAP);
          heightOffset = THREE.MathUtils.clamp(heightOffset, HEIGHT_MIN, HEIGHT_MAX);
          const eye = 1.6 + platformHeightAt(playerRig.position.x, playerRig.position.z) + heightOffset;
          const infoEl = document.getElementById('info');
          if (infoEl) infoEl.textContent = 'Height ' + eye.toFixed(2) + ' m';
        }
        prevFaceButtons = face;

        const thumbstick = getLeftThumbstickFromSession();

        if (thumbstick.x !== 0 || thumbstick.y !== 0) {
          const xrCamera = renderer.xr.getCamera(camera);
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(xrCamera.quaternion);
          forward.y = 0;
          forward.normalize();

          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(xrCamera.quaternion);
          right.y = 0;
          right.normalize();

          const moveDirection = new THREE.Vector3();
          moveDirection.addScaledVector(forward, -thumbstick.y);
          moveDirection.addScaledVector(right, thumbstick.x);

          if (moveDirection.lengthSq() > 0) {
            moveDirection.normalize();
            playerRig.position.addScaledVector(moveDirection, 1.5 * delta);
          }
        }

        // Right thumbstick: turn view left/right (yaw)
        const rightStick = getRightThumbstickFromSession();
        if (rightStick.x !== 0) {
          playerRig.rotation.y -= rightStick.x * 1.8 * delta;
        }
        playerRig.rotation.z = 0;
      }

      // Follow the walking surface (stairs / landing) plus the elevator offset
      const surfaceY = platformHeightAt(playerRig.position.x, playerRig.position.z);
      const targetRigY = surfaceY + heightOffset;
      playerRig.position.y += (targetRigY - playerRig.position.y) * Math.min(1, delta * 8);

       // Tether return animation
       for (let i = returningObjects.length - 1; i >= 0; i--) {
         const o = returningObjects[i];
         if (!o || !o.userData || !o.userData.homePosition || !o.userData.returnStart || !o.userData.returnQuatStart) {
           returningObjects.splice(i, 1);
           continue;
         }
         o.userData.returnProgress = (o.userData.returnProgress || 0) + delta * 2.5;
         const t = Math.min(1, o.userData.returnProgress);
         const ease = 1 - Math.pow(1 - t, 3);
         if (!o.userData.returnStart) o.userData.returnStart = o.position.clone();
         o.position.lerpVectors(o.userData.returnStart, o.userData.homePosition, ease);
         o.quaternion.copy(o.userData.returnQuatStart).slerp(o.userData.homeQuaternion, ease);
         if (t >= 1) {
           o.position.copy(o.userData.homePosition);
           o.quaternion.copy(o.userData.homeQuaternion);
           returningObjects.splice(i, 1);
         }
       }

       renderer.render(scene, camera);
      } catch (e) {
        console.error('LOOP ERR', e);
        const info = document.getElementById('info');
        if (info) info.textContent = 'ERROR: ' + (e && e.message ? e.message : e);
      }
    });

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('Pickable objects:', pickableObjects.length);
  </script>
</body>
</html>

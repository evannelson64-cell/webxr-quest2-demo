<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Low Poly Kitchen – WebXR with Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      pointer-events: none;
      font-size: 14px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #vr-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: 0.2s;
      letter-spacing: 0.5px;
    }
    #vr-button:hover {
      background: #ff4757;
      transform: translateX(-50%) scale(1.05);
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      background: rgba(0,0,0,0.6);
      padding: 12px 24px;
      border-radius: 30px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="info">🍳 Low Poly Kitchen • Pick up items with trigger • Move with left joystick</div>
  <button id="vr-button">Enter VR</button>
  <div id="loading">Entering VR…</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaaccff);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- VR Button ---
    const vrButton = document.getElementById('vr-button');
    const loadingEl = document.getElementById('loading');
    const vrButtonThree = VRButton.createButton(renderer);
    vrButtonThree.style.display = 'none';
    document.body.appendChild(vrButtonThree);

    vrButton.addEventListener('click', () => {
      loadingEl.style.display = 'block';
      vrButtonThree.click();
    });

    renderer.xr.addEventListener('sessionstart', () => {
      loadingEl.style.display = 'none';
      console.log('XR session started');
    });

    renderer.xr.addEventListener('sessionend', () => {
      loadingEl.style.display = 'none';
      console.log('XR session ended');
    });

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
    dirLight.position.set(2, 5, 3);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const fillLight = new THREE.PointLight(0xffeedd, 0.5);
    fillLight.position.set(-2, 3, 2);
    scene.add(fillLight);

    // --- Floor ---
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xd9b382, roughness: 0.8 });
    const floorGeo = new THREE.PlaneGeometry(6, 6);
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(6, 12, 0x8b6b4d, 0x8b6b4d);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // --- Walls ---
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf0e6d2, roughness: 0.9 });

    const backWall = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 0.2), wallMat);
    backWall.position.set(0, 1.5, -2.9);
    backWall.receiveShadow = true;
    backWall.castShadow = true;
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 6), wallMat);
    leftWall.position.set(-2.9, 1.5, 0);
    leftWall.receiveShadow = true;
    leftWall.castShadow = true;
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 6), wallMat);
    rightWall.position.set(2.9, 1.5, 0);
    rightWall.receiveShadow = true;
    rightWall.castShadow = true;
    scene.add(rightWall);

    // --- Helper ---
    function createBox(w, h, d, color, pos, rot = null) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5, flatShading: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      if (rot) mesh.rotation.set(rot.x, rot.y, rot.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const HINDI = {
      'Refrigerator': 'फ्रिज',
      'Counter': 'काउंटर',
      'Stove': 'चूल्हा',
      'Sink': 'सिंक',
      'Chair': 'कुर्सी',
      'Table': 'मेज़',
      'Plate': 'थाली',
      'Fork': 'कांटा',
      'Spoon': 'चम्मच',
      'Mug': 'मग'
    };
    function addLabel(parent, text, height) {
      const hindi = HINDI[text] || text;
      parent.userData.hindi = hindi;
      parent.userData.label = text;
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 96;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 96);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.font = 'bold 24px Arial';
      ctx.fillText(text, 128, 28);
      ctx.font = 'bold 26px "Noto Sans Devanagari", "Mangal", Arial';
      ctx.fillText(hindi, 128, 68);
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(0.6, 0.22, 1);
      sprite.position.set(0, height, 0);
      sprite.userData.isPickable = false;
      sprite.raycast = function() {};
      parent.add(sprite);
      return sprite;
    }
    // --- Refrigerator ---
    const fridgeGroup = new THREE.Group();
    const fridgeBody = createBox(1.0, 1.8, 0.8, 0xcccccc, { x: 0, y: 0.9, z: 0 });
    fridgeGroup.add(fridgeBody);
    const handle = createBox(0.08, 0.4, 0.08, 0x888888, { x: 0.45, y: 1.0, z: 0 });
    fridgeGroup.add(handle);
    const divider = createBox(1.0, 0.04, 0.8, 0xaaaaaa, { x: 0, y: 1.2, z: 0 });
    fridgeGroup.add(divider);
    const handle2 = createBox(0.08, 0.2, 0.08, 0x888888, { x: 0.45, y: 1.6, z: 0 });
    fridgeGroup.add(handle2);
    fridgeGroup.position.set(-2.2, 0, -2.4);
    fridgeGroup.userData.isEnvironment = true;
    fridgeGroup.userData.label = 'Refrigerator';
    [fridgeBody, handle, divider, handle2].forEach(m => { m.userData.isEnvironment = true; m.userData.isPickable = false; });
    scene.add(fridgeGroup);
    addLabel(fridgeGroup, 'Refrigerator', 2.0);

    // --- Kitchen Counter ---
    const counterMat = new THREE.MeshStandardMaterial({ color: 0xc7a27a, roughness: 0.7, flatShading: true });
    const counterTop = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.1, 1.0), counterMat);
    counterTop.position.set(0.5, 0.9, -2.3);
    counterTop.castShadow = true;
    counterTop.receiveShadow = true;
    counterTop.userData.isEnvironment = true;
    scene.add(counterTop);
    addLabel(counterTop, 'Counter', 0.2);

    const baseMat = new THREE.MeshStandardMaterial({ color: 0xb08b5e, roughness: 0.8, flatShading: true });
    const base1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), baseMat);
    base1.position.set(-1.2, 0.4, -2.3);
    base1.castShadow = true;
    base1.receiveShadow = true;
    scene.add(base1);
    const base2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), baseMat);
    base2.position.set(0.5, 0.4, -2.3);
    base2.castShadow = true;
    base2.receiveShadow = true;
    scene.add(base2);
    const base3 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), baseMat);
    base3.position.set(2.2, 0.4, -2.3);
    base3.castShadow = true;
    base3.receiveShadow = true;
    scene.add(base3);

    const sideCounter = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 1.8), counterMat);
    sideCounter.position.set(-2.1, 0.9, -1.2);
    sideCounter.castShadow = true;
    sideCounter.receiveShadow = true;
    scene.add(sideCounter);
    const sideBase = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 1.6), baseMat);
    sideBase.position.set(-2.1, 0.4, -1.2);
    sideBase.castShadow = true;
    sideBase.receiveShadow = true;
    scene.add(sideBase);

    // --- Stove ---
    const stoveBase = createBox(0.8, 0.1, 0.8, 0x333333, { x: 1.0, y: 0.95, z: -2.3 });
    stoveBase.userData.isEnvironment = true;
    scene.add(stoveBase);
    addLabel(stoveBase, 'Stove', 0.3);
    const burnerMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x331100 });
    for (let i = 0; i < 4; i++) {
      const burner = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.02, 8), burnerMat);
      burner.position.set(1.0 + (i % 2 === 0 ? -0.2 : 0.2), 1.02, -2.3 + (i < 2 ? -0.2 : 0.2));
      burner.castShadow = true;
      burner.userData.isEnvironment = true;
      burner.userData.isPickable = false;
      scene.add(burner);
    }

    // --- Sink ---
    const sinkMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.6, roughness: 0.3 });
    const sinkBasin = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.15, 0.7), sinkMat);
    sinkBasin.position.set(-0.5, 0.85, -2.3);
    sinkBasin.castShadow = true;
    sinkBasin.receiveShadow = true;
    sinkBasin.userData.isEnvironment = true;
    scene.add(sinkBasin);
    addLabel(sinkBasin, 'Sink', 0.3);
    const faucetGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.4, 6);
    const faucetMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 });
    const faucet = new THREE.Mesh(faucetGeo, faucetMat);
    faucet.position.set(-0.5, 1.15, -2.1);
    faucet.rotation.x = 0.3;
    faucet.castShadow = true;
    faucet.userData.isEnvironment = true;
    faucet.userData.isPickable = false;
    scene.add(faucet);

    // --- Chair ---
    function createChair(posX, posZ, rotY = 0) {
      const chairGroup = new THREE.Group();
      const seatMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.7, flatShading: true });
      const legMat = new THREE.MeshStandardMaterial({ color: 0x5a3e1a, roughness: 0.8, flatShading: true });

      const seat = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 0.7), seatMat);
      seat.position.y = 0.45;
      seat.castShadow = true;
      seat.receiveShadow = true;
      chairGroup.add(seat);

      const back = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.08), seatMat);
      back.position.set(0, 0.8, -0.3);
      back.castShadow = true;
      back.receiveShadow = true;
      chairGroup.add(back);

      const legPositions = [
        [-0.3, 0.2, -0.3],
        [0.3, 0.2, -0.3],
        [-0.3, 0.2, 0.3],
        [0.3, 0.2, 0.3]
      ];
      legPositions.forEach(pos => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.45, 0.1), legMat);
        leg.position.set(pos[0], pos[1], pos[2]);
        leg.castShadow = true;
        leg.receiveShadow = true;
        chairGroup.add(leg);
      });

      chairGroup.position.set(posX, 0, posZ);
      chairGroup.rotation.y = rotY;
      chairGroup.userData.isPickable = true;
      chairGroup.userData.label = 'Chair';
      chairGroup.traverse((c) => { if (c !== chairGroup) c.userData.isPickable = false; });
      addLabel(chairGroup, 'Chair', 1.2);
      return chairGroup;
    }

    scene.add(createChair(-1.0, 0.8, 0.2));
    scene.add(createChair(0.8, 1.2, -0.3));
    scene.add(createChair(1.8, 0.2, 0.5));

    // --- Table ---
    const tableGroup = new THREE.Group();
    const tableMat = new THREE.MeshStandardMaterial({ color: 0xa67b5b, roughness: 0.7, flatShading: true });
    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 1.0), tableMat);
    tableTop.position.set(0.5, 0.75, 0.5);
    tableTop.castShadow = true;
    tableTop.receiveShadow = true;
    tableTop.userData.isEnvironment = true;
    tableTop.userData.isPickable = false;
    tableGroup.add(tableTop);

    const tLegMat = new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 0.8 });
    const tLegPos = [[0.5-0.7, 0.35, 0.5-0.4], [0.5+0.7, 0.35, 0.5-0.4], [0.5-0.7, 0.35, 0.5+0.4], [0.5+0.7, 0.35, 0.5+0.4]];
    tLegPos.forEach(pos => {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.7, 0.1), tLegMat);
      leg.position.set(pos[0], pos[1], pos[2]);
      leg.castShadow = true;
      leg.receiveShadow = true;
      leg.userData.isEnvironment = true;
      leg.userData.isPickable = false;
      tableGroup.add(leg);
    });
    tableGroup.userData.isEnvironment = true;
    tableGroup.userData.label = 'Table';
    scene.add(tableGroup);
    addLabel(tableGroup, 'Table', 1.0);

    // --- Plates, Forks, Spoons ---
    function createPlate(x, y, z) {
      const plateGroup = new THREE.Group();
      const plateMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.3, flatShading: true });
      const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.03, 8), plateMat);
      plate.position.set(0, 0, 0);
      plate.castShadow = true;
      plate.receiveShadow = true;
      plateGroup.add(plate);
      const innerMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.4 });
      const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.01, 8), innerMat);
      inner.position.set(0, 0.015, 0);
      inner.castShadow = true;
      inner.receiveShadow = true;
      plateGroup.add(inner);
      plateGroup.position.set(x, y, z);
      plateGroup.userData.isPickable = true;
      plateGroup.userData.label = 'Plate';
      plate.userData.isPickable = false;
      inner.userData.isPickable = false;
      scene.add(plateGroup);
      addLabel(plateGroup, 'Plate', 0.15);
    }

    function createFork(x, y, z, rotY = 0) {
      const forkGroup = new THREE.Group();
      const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.7, roughness: 0.3 });
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.01, 0.2), metalMat);
      handle.position.set(0, 0, 0);
      handle.castShadow = true;
      handle.receiveShadow = true;
      forkGroup.add(handle);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.01, 0.06), metalMat);
      head.position.set(0, 0, 0.12);
      head.castShadow = true;
      head.receiveShadow = true;
      forkGroup.add(head);
      for (let i = -1; i <= 1; i++) {
        const tine = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.01, 0.04), metalMat);
        tine.position.set(i * 0.02, 0, 0.16);
        tine.castShadow = true;
        tine.receiveShadow = true;
        forkGroup.add(tine);
      }
      forkGroup.position.set(x, y, z);
      forkGroup.rotation.y = rotY;
      forkGroup.userData.isPickable = true;
      forkGroup.userData.label = 'Fork';
      forkGroup.traverse((c) => { if (c !== forkGroup) c.userData.isPickable = false; });
      scene.add(forkGroup);
      addLabel(forkGroup, 'Fork', 0.1);
    }

    function createSpoon(x, y, z, rotY = 0) {
      const spoonGroup = new THREE.Group();
      const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.7, roughness: 0.3 });
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.01, 0.2), metalMat);
      handle.position.set(0, 0, 0);
      handle.castShadow = true;
      handle.receiveShadow = true;
      spoonGroup.add(handle);
      const bowlGeo = new THREE.SphereGeometry(0.05, 6, 4);
      const bowl = new THREE.Mesh(bowlGeo, metalMat);
      bowl.scale.set(1, 0.2, 1.2);
      bowl.position.set(0, 0.01, 0.12);
      bowl.castShadow = true;
      bowl.receiveShadow = true;
      spoonGroup.add(bowl);
      spoonGroup.position.set(x, y, z);
      spoonGroup.rotation.y = rotY;
      spoonGroup.userData.isPickable = true;
      spoonGroup.userData.label = 'Spoon';
      spoonGroup.traverse((c) => { if (c !== spoonGroup) c.userData.isPickable = false; });
      scene.add(spoonGroup);
      addLabel(spoonGroup, 'Spoon', 0.1);
    }

    createPlate(0.5, 0.81, 0.5);
    createFork(0.4, 0.82, 0.45, 0.5);
    createSpoon(0.6, 0.82, 0.55, -0.3);
    createPlate(0.8, 0.81, 0.3);
    createFork(0.75, 0.82, 0.25, 0.2);

    createPlate(-0.5, 0.96, -2.3);
    createSpoon(-0.3, 0.96, -2.3);
    createFork(0.2, 0.96, -2.3);

    // Mugs
    const mugMat = new THREE.MeshStandardMaterial({ color: 0x6b8e23, roughness: 0.5 });
    const mug1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.15, 6), mugMat);
    mug1.position.set(-1.0, 0.98, -2.1);
    mug1.castShadow = true;
    mug1.receiveShadow = true;
    mug1.userData.isPickable = true;
    mug1.userData.label = 'Mug';
    scene.add(mug1);
    addLabel(mug1, 'Mug', 0.2);
    const mug2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.15, 6), new THREE.MeshStandardMaterial({ color: 0xb22222, roughness: 0.5 }));
    mug2.position.set(1.8, 0.98, -2.4);
    mug2.castShadow = true;
    mug2.receiveShadow = true;
    mug2.userData.isPickable = true;
    mug2.userData.label = 'Mug';
    scene.add(mug2);
    addLabel(mug2, 'Mug', 0.2);

    // --- Controllers ---
    const controllerModelFactory = new XRControllerModelFactory();

    const controller0 = renderer.xr.getController(0);
    const controller1 = renderer.xr.getController(1);
    scene.add(controller0);
    scene.add(controller1);

    const grip0 = renderer.xr.getControllerGrip(0);
    grip0.add(controllerModelFactory.createControllerModel(grip0));
    scene.add(grip0);
    const grip1 = renderer.xr.getControllerGrip(1);
    grip1.add(controllerModelFactory.createControllerModel(grip1));
    scene.add(grip1);

    const rayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
    const rayMat = new THREE.LineBasicMaterial({ color: 0xffaa00 });
    const ray0 = new THREE.Line(rayGeo, rayMat);
    ray0.scale.z = 5;
    controller0.add(ray0);
    const ray1 = new THREE.Line(rayGeo, rayMat);
    ray1.scale.z = 5;
    controller1.add(ray1);

    // --- Player Rig (dolly) ---
    const playerRig = new THREE.Group();
    playerRig.position.set(0, 0, 0);
    scene.add(playerRig);

    camera.position.set(0, 1.6, 0);
    playerRig.add(camera);
    playerRig.add(controller0);
    playerRig.add(controller1);
    playerRig.add(grip0);
    playerRig.add(grip1);

    playerRig.position.set(0, 0, 2.5);

    // --- Pickable objects list ---
    const pickableObjects = [];
    const environmentObjects = new Set([
      floor, gridHelper, backWall, leftWall, rightWall,
      fridgeBody, handle, divider, handle2,
      counterTop, base1, base2, base3, sideCounter, sideBase,
      stoveBase, sinkBasin, faucet,
      tableTop
    ]);

    environmentObjects.forEach(obj => {
      obj.userData.isEnvironment = true;
    });

    scene.traverse((obj) => {
      if (obj.isMesh || obj.isGroup) {
        if (environmentObjects.has(obj)) return;
        if (obj.userData.isEnvironment) return;
        if (obj === camera || obj === controller0 || obj === controller1 ||
            obj === grip0 || obj === grip1 || obj === playerRig) return;
        if (obj.parent === controller0 || obj.parent === controller1) return;
        if (obj.isLight) return;

        const box = new THREE.Box3().setFromObject(obj);
        const size = new THREE.Vector3();
        box.getSize(size);
        const volume = size.x * size.y * size.z;

        // If an ancestor is already pickable, this part belongs to that unit
        let ancestorPickable = false;
        let p = obj.parent;
        while (p) {
          if (p.userData && p.userData.isPickable === true) { ancestorPickable = true; break; }
          p = p.parent;
        }
        if (ancestorPickable) {
          obj.userData.isPickable = false;
          return;
        }

        if (obj.userData.isPickable !== true && volume < 0.05) {
          obj.userData.isPickable = true;
        }
        if (obj.userData.isPickable === true && obj.isGroup) {
          obj.children.forEach(child => {
            if (child.isMesh) child.userData.isPickable = false;
          });
        }
      }
    });

    scene.traverse((obj) => {
      if (obj.userData.isPickable === true) {
        let parent = obj.parent;
        let isChildOfPickable = false;
        while (parent) {
          if (parent.userData.isPickable === true) {
            isChildOfPickable = true;
            break;
          }
          parent = parent.parent;
        }
        if (!isChildOfPickable) {
          pickableObjects.push(obj);
        }
      }
    });

    // Record home transforms for tether return
    pickableObjects.forEach((o) => {
      o.userData.homePosition = o.position.clone();
      o.userData.homeQuaternion = o.quaternion.clone();
      o.userData.homeParent = o.parent || scene;
    });

    // --- Controller state ---
    const controllerState = [
      { object: null },
      { object: null }
    ];
    const returningObjects = [];

    const raycaster = new THREE.Raycaster();

    // --- Select handlers ---
    function speakHindi(text) {
      if (!text) return;
      const info = document.getElementById('info');
      if (info) info.textContent = 'Speaking: ' + text;
      const url = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=hi&client=tw-ob&q=' + encodeURIComponent(text);
      const audio = new Audio(url);
      let played = false;
      const fallback = () => {
        if (played) return;
        played = true;
        if ('speechSynthesis' in window) {
          try {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'hi-IN';
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(u);
            if (info) info.textContent = 'Speaking (fallback): ' + text;
          } catch (err) { console.error('SPEECH ERR', err); }
        }
      };
      audio.addEventListener('playing', () => { played = true; });
      audio.addEventListener('error', (e) => { console.error('AUDIO ERR', e); fallback(); });
      setTimeout(fallback, 1500);
      audio.play().then(() => { played = true; }).catch((e) => { console.error('PLAY ERR', e); fallback(); });
    }

    function onSelectStartPick(event) {
      const controller = event.target;
      const controllerIndex = controller === controller0 ? 0 : 1;

      // Speak Hindi for any labeled object being pointed at
      const tempMatrix0 = new THREE.Matrix4();
      tempMatrix0.identity().extractRotation(controller.matrixWorld);
      const rc = new THREE.Raycaster();
      rc.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      rc.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix0);
      const allHits = rc.intersectObjects(scene.children, true);
      for (let i = 0; i < allHits.length; i++) {
        let o = allHits[i].object;
        let spoken = false;
        while (o) {
          if (o.userData && o.userData.hindi) {
            speakHindi(o.userData.hindi);
            spoken = true;
            break;
          }
          o = o.parent;
        }
        if (spoken) break;
      }

      if (controllerState[controllerIndex].object) return;

      const tempMatrix = new THREE.Matrix4();
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const intersects = raycaster.intersectObjects(pickableObjects, true);

      for (let i = 0; i < intersects.length; i++) {
        let hitObj = intersects[i].object;
        let pickableRoot = null;
        while (hitObj) {
          if (hitObj.userData.isPickable === true) {
            pickableRoot = hitObj;
            break;
          }
          hitObj = hitObj.parent;
        }
        if (pickableRoot) {
          // cancel any in-flight return
          const ri = returningObjects.indexOf(pickableRoot);
          if (ri !== -1) returningObjects.splice(ri, 1);
          controller.attach(pickableRoot);
          pickableRoot.position.set(0, 0, -0.2);
          pickableRoot.rotation.set(0, 0, 0);
          controllerState[controllerIndex].object = pickableRoot;
          break;
        }
      }
    }

    function onSelectEndDrop(event) {
      const controller = event.target;
      const controllerIndex = controller === controller0 ? 0 : 1;

       if (controllerState[controllerIndex].object) {
         const heldObj = controllerState[controllerIndex].object;
         const worldPos = new THREE.Vector3();
         heldObj.getWorldPosition(worldPos);
         const worldQuat = new THREE.Quaternion();
         heldObj.getWorldQuaternion(worldQuat);
         controller.remove(heldObj);
         scene.add(heldObj);
         heldObj.position.copy(worldPos);
         heldObj.quaternion.copy(worldQuat);
         if (!heldObj.userData.homePosition) {
           heldObj.userData.homePosition = worldPos.clone();
           heldObj.userData.homeQuaternion = worldQuat.clone();
         }
         // tether: animate back to home
         heldObj.userData.returnStart = heldObj.position.clone();
         heldObj.userData.returnQuatStart = heldObj.quaternion.clone();
         heldObj.userData.returnProgress = 0;
         if (!returningObjects.includes(heldObj)) returningObjects.push(heldObj);
         controllerState[controllerIndex].object = null;
       }
    }

    controller0.addEventListener('selectstart', onSelectStartPick);
    controller0.addEventListener('selectend', onSelectEndDrop);
    controller1.addEventListener('selectstart', onSelectStartPick);
    controller1.addEventListener('selectend', onSelectEndDrop);

    // --- NEW: Left thumbstick from session ---
    function getLeftThumbstickFromSession() {
      const session = renderer.xr.getSession();
      if (!session) return { x: 0, y: 0 };

      for (const inputSource of session.inputSources) {
        if (inputSource && inputSource.handedness === 'left' && inputSource.gamepad && inputSource.gamepad.axes) {
          const axes = inputSource.gamepad.axes;
          let x = 0;
          let y = 0;

          if (axes.length >= 4) {
            const mag01 = Math.hypot(axes[0] || 0, axes[1] || 0);
            const mag23 = Math.hypot(axes[2] || 0, axes[3] || 0);

            if (mag23 >= mag01) {
              x = axes[2];
              y = axes[3];
            } else {
              x = axes[0];
              y = axes[1];
            }
          } else if (axes.length >= 2) {
            x = axes[0];
            y = axes[1];
          }

          if (Math.abs(x) < 0.12) x = 0;
          if (Math.abs(y) < 0.12) y = 0;

          return { x, y };
        }
      }

      return { x: 0, y: 0 };
    }

    function getRightThumbstickFromSession() {
      const session = renderer.xr.getSession();
      if (!session) return { x: 0, y: 0 };

      for (const inputSource of session.inputSources) {
        if (inputSource && inputSource.handedness === 'right' && inputSource.gamepad && inputSource.gamepad.axes) {
          const axes = inputSource.gamepad.axes;
          let x = 0;
          let y = 0;

          if (axes.length >= 4) {
            const mag01 = Math.hypot(axes[0] || 0, axes[1] || 0);
            const mag23 = Math.hypot(axes[2] || 0, axes[3] || 0);

            if (mag23 >= mag01) {
              x = axes[2];
              y = axes[3];
            } else {
              x = axes[0];
              y = axes[1];
            }
          } else if (axes.length >= 2) {
            x = axes[0];
            y = axes[1];
          }

          if (Math.abs(x) < 0.12) x = 0;
          if (Math.abs(y) < 0.12) y = 0;

          return { x, y };
        }
      }

      return { x: 0, y: 0 };
    }
    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      try {
      const delta = clock.getDelta();

      if (renderer.xr.isPresenting) {
        const thumbstick = getLeftThumbstickFromSession();

        if (thumbstick.x !== 0 || thumbstick.y !== 0) {
          const xrCamera = renderer.xr.getCamera(camera);
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(xrCamera.quaternion);
          forward.y = 0;
          forward.normalize();

          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(xrCamera.quaternion);
          right.y = 0;
          right.normalize();

          const moveDirection = new THREE.Vector3();
          moveDirection.addScaledVector(forward, -thumbstick.y);
          moveDirection.addScaledVector(right, thumbstick.x);

          if (moveDirection.lengthSq() > 0) {
            moveDirection.normalize();
            playerRig.position.addScaledVector(moveDirection, 1.5 * delta);
          }
        }

        // Right thumbstick: turn view left/right (yaw)
        const rightStick = getRightThumbstickFromSession();
        if (rightStick.x !== 0) {
          playerRig.rotation.y -= rightStick.x * 1.8 * delta;
        }
        playerRig.rotation.z = 0;
      }

       // Tether return animation
       for (let i = returningObjects.length - 1; i >= 0; i--) {
         const o = returningObjects[i];
         if (!o || !o.userData || !o.userData.homePosition || !o.userData.returnStart || !o.userData.returnQuatStart) {
           returningObjects.splice(i, 1);
           continue;
         }
         o.userData.returnProgress = (o.userData.returnProgress || 0) + delta * 2.5;
         const t = Math.min(1, o.userData.returnProgress);
         const ease = 1 - Math.pow(1 - t, 3);
         if (!o.userData.returnStart) o.userData.returnStart = o.position.clone();
         o.position.lerpVectors(o.userData.returnStart, o.userData.homePosition, ease);
         o.quaternion.copy(o.userData.returnQuatStart).slerp(o.userData.homeQuaternion, ease);
         if (t >= 1) {
           o.position.copy(o.userData.homePosition);
           o.quaternion.copy(o.userData.homeQuaternion);
           returningObjects.splice(i, 1);
         }
       }

       renderer.render(scene, camera);
      } catch (e) {
        console.error('LOOP ERR', e);
        const info = document.getElementById('info');
        if (info) info.textContent = 'ERROR: ' + (e && e.message ? e.message : e);
      }
    });

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('Pickable objects:', pickableObjects.length);
  </script>
</body>
